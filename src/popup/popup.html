<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Screenshot Editor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="popup-header">
        <h1 class="popup-title">
          📸 <span data-i18n="popupTitle"></span>
        </h1>
      </header>

      <main class="popup-main">
        <div class="popup-description" data-i18n="popupDescription"></div>

        <div class="popup-actions">
          <button id="startSelectionBtn" class="popup-btn popup-btn--primary">
            <span data-i18n="startSelectionBtn"></span>
          </button>
        </div>

        <div class="popup-instructions">
          <h3 data-i18n="howToUseTitle"></h3>
          <ol>
            <li data-i18n="howToUseStep1"></li>
            <li data-i18n="howToUseStep2"></li>
            <li data-i18n="howToUseStep3"></li>
            <li data-i18n="howToUseStep4"></li>
            <li data-i18n="howToUseStep5"></li>
          </ol>
        </div>

        <div class="popup-shortcuts">
          <h3 data-i18n="keyboardShortcutsTitle"></h3>
          <ul>
            <li>
              <kbd>ESC</kbd>
              &nbsp;-&nbsp;
              <span class="popup-shortcuts__label" data-i18n="shortcutEsc"></span>
            </li>
            <li>
              <kbd>Enter</kbd>
              &nbsp;-&nbsp;
              <span class="popup-shortcuts__label" data-i18n="shortcutEnter"></span>
            </li>
            <li>
              <kbd>↑</kbd>
              /
              <kbd>←</kbd>
              &nbsp;-&nbsp;
              <span class="popup-shortcuts__label" data-i18n="shortcutUpLeft"></span>
            </li>
            <li>
              <kbd>↓</kbd>
              /
              <kbd>→</kbd>
              &nbsp;-&nbsp;
              <span class="popup-shortcuts__label" data-i18n="shortcutDownRight"></span>
            </li>
          </ul>
        </div>
      </main>

      <footer class="popup-footer">
        <div class="popup-version">v1.2.0</div>
      </footer>
    </div>

    <script src="../utils/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
