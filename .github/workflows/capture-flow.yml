name: Capture flow browser tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/capture-flow.test.cjs
      - name: Install browser and OS input tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool xclip
      - name: Test unpacked extension with OS input and clipboard
        run: xvfb-run -a node tests/browser-flow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-flow-browser-evidence
          path: test-results/
